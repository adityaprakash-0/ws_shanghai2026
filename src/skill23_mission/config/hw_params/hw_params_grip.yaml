control_server:
  ros__parameters:

    # -------------------------------------------------------------------------
    # Titan — CAN bus motor controller (up to 4 motors per unit)
    # -------------------------------------------------------------------------
    titan:
      enabled: true
      sensors: ["titan0", "titan1"]  # titan1: OMS rotate m_2, lift m_1, home lim m_0
      titan0:
        can_id: 42
        motor_freq: 15600
        encoder_rate_hz: 20
        motor_update_rate_hz: 50
        limit_switches: false
        enable_freshness: true
        m_0:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_1:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_2:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: false 
          invert_rpm: false
        m_3:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: false
          invert_rpm: false
      titan1:
        can_id: 43
        motor_freq: 15600
        # OMS on titan1: m_2 rotate, m_1 lift, m_3 Cypher linear encoder.
        # m_0 limit_rev = rotation home; m_0 limit_fwd = linear home.
        encoder_rate_hz: 10
        motor_update_rate_hz: 20
        limit_switches: true
        enable_freshness: true
        m_0:  # limit_rev=rotation home, limit_fwd=linear home
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_1:  # OMS belt lift — limit_fwd=up (home), limit_rev=down (floor)
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_2:  # OMS rotation
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_3:  # Cypher Max linear encoder (quadrature)
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false

    # -------------------------------------------------------------------------
    # IMU — onboard 9-axis IMU
    # -------------------------------------------------------------------------
    imu:
      enabled: true
      name: "imu"
      topic: "imu"
      frame_id: "imu_link"

    # -------------------------------------------------------------------------
    # Encoder — quadrature encoder via two digital input channels
    # -------------------------------------------------------------------------
    encoder:
      enabled: false
      sensors: ["external_encoder"]
      external_encoder:
        port_a: 0
        port_b: 1
        topic: "external_encoder"

    # -------------------------------------------------------------------------
    # Duty Cycle Encoder — absolute encoder via PWM duty cycle
    # -------------------------------------------------------------------------
    duty_cycle:
      enabled: false
      sensors: ["absolute_encoder"]
      absolute_encoder:
        port: 8
        topic: "duty_cycle_encoder"

    # -------------------------------------------------------------------------
    # Servo — standard, continuous, or linear servo
    # -------------------------------------------------------------------------
    servo:
      enabled: false
      sensors: ["linear_servo", "vertical_servo", "rotation_servo", "gripper_servo"]
      linear_servo:       # pin 12, continuous speed −100…100
        port: 12
        type: "continuous"
      vertical_servo:     # pin 13, standard degrees −150…150
        port: 13
        type: "standard"
      rotation_servo:     # pin 14, standard degrees −150…150
        port: 14
        type: "standard"
      gripper_servo:      # pin 15, standard degrees −150…150
        port: 15
        type: "standard"

    # -------------------------------------------------------------------------
    # Ultrasonic — HC-SR04-style sonar range sensor
    # -------------------------------------------------------------------------
    ultrasonic:
      enabled: false
      sensors: ["front_sonar"]
      front_sonar:
        ping: 8
        echo: 9
        frame_id: "front_sonar_link"
      # US-align sensors (enable ultrasonic + add these to sensors list to use)
      # front_left_sonar:
      #   ping: 10
      #   echo: 11
      #   frame_id: "front_left_sonar_link"
      # front_right_sonar:
      #   ping: 12
      #   echo: 13
      #   frame_id: "front_right_sonar_link"

    # -------------------------------------------------------------------------
    # Sharp — GP2Y-series infrared range sensor
    # -------------------------------------------------------------------------
    sharp:
      enabled: false
      sensors: ["wall_sensor"]
      wall_sensor:
        port: 22
        frame_id: "sharp_link"

    # -------------------------------------------------------------------------
    # DIO — digital input or output pin
    # -------------------------------------------------------------------------
    dio:
      enabled: false
      sensors: ["limit_switch"]
      limit_switch:
        pin: 15
        type: "input" # "input" or "output"

    # -------------------------------------------------------------------------
    # Cobra — 4-channel reflectance sensor array (I2C)
    # -------------------------------------------------------------------------
    cobra:
      enabled: false
      sensors: ["line_follower"]
      line_follower:
        vref: 5.0

    # -------------------------------------------------------------------------
    # Light Tower — 5-output indicator LED tower
    # -------------------------------------------------------------------------
    light_tower:
      enabled: false
      name: "light_tower"
      pin_continuous: 0
      pin_red: 1
      pin_green: 2
      pin_yellow: 3
      pin_buzzer: 4
      default_blink_hz: 1.0

    # -------------------------------------------------------------------------
    # Colore — Studica color sensor (CAN or USB)
    # -------------------------------------------------------------------------
    colore:
      enabled: false
      sensors: ["colore0"]
      colore0:
        transport: "usb"
        can_id: 0
        serial_port: "/dev/ttyACM0"
        publish_rate_hz: 10
        publish_outputs: ["info"]
        brightness: 50
        measmode: "off"
        measmode_z_mm: -1.0
        # omit match_references (Humble crashes on YAML [])
        match_threshold: 0.05

    # -------------------------------------------------------------------------
    # Parsec — Studica multi-zone ToF (CAN or USB)
    # -------------------------------------------------------------------------
    parsec:
      enabled: false
      sensors: ["parsec0"]
      parsec0:
        transport: "usb"
        can_id: 0
        serial_port: "/dev/ttyACM0"
        frame_id: "parsec0"
        publish_rate_hz: 15
        publish_outputs: ["grid"]

    # -------------------------------------------------------------------------
    # Gamepad — MUST stay false for custom_nav / RPP (fights /cmd_vel @ 50 Hz)
    gamepad:
      enabled: true
      axis_linear_x: 1
      axis_linear_y: -1
      axis_angular_z: 2
      button_turbo: 5
      linear_scale: 0.2
      angular_scale: 0.3
      deadzone: 0.05
      turbo_multiplier: 2.0
      publish_rate: 50
      cmd_vel_topic: "cmd_vel"