# =============================================================================
# EKF — All-terrain skid-steer (VMX Pi 4B) · differential (vx + vyaw only)
# =============================================================================
# Input:  /wheel/odom (allterrain_node) + /imu
# Output: /odometry/filtered + odom → base_footprint TF
# AMCL owns map ↔ odom; EKF owns odom ↔ base_footprint.
#
# NOT holonomic — no lateral vy. Wheel slip on x,y → do not fuse absolute position.
#
# State vector: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
# =============================================================================

ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    publish_tf: true
    publish_acceleration: false

    # -------------------------------------------------------------------------
    # ODOM0: /wheel/odom — diff-drive kinematics (no strafe)
    # -------------------------------------------------------------------------
    odom0: /wheel/odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    # x,y   OFF — skid-steer slip; AMCL corrects global pose
    # yaw   ON  — heading from wheel node (do NOT also fuse IMU quaternion)
    # vx    ON  — forward speed
    # vy    OFF — non-holonomic; robot cannot strafe
    # vyaw  ON  — turn rate from wheel node
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    # -------------------------------------------------------------------------
    # IMU0: /imu — no magnetometer-affected orientation indoors
    # vyaw cross-check (raw gyro z); ax only (no lateral ay on diff drive)
    # -------------------------------------------------------------------------
    imu0: /imu
    imu0_queue_size: 15
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]

