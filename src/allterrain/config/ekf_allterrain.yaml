# =============================================================================
# EKF — Allterrain skid-steer (NO strafe)
# =============================================================================
# Tuned from skill23_test 2026-08-25 (wheels, 125 mm dia / r=0.0625)
# + xdrive IMU 2026-08-23 (same IMU):
#   ODOM: fwd scale 0.9966 (≈1) | RMSE 0.0042 m → Q_x/Q_y 4e-4 (floor)
#   IMU:  static drift 0.06 deg/min | yaw scale ~0.996
#         ax/ay too noisy → NOT fused (yaw + vyaw only)
#
# Measurement R in sensor nodes (allterrain_node + imu_component):
#   pose x,y ≈ 4e-4 | vx ≈ 0.0025 | IMU yaw ≈ 0.02 | wz ≈ 0.001
#
# Sources (wheel yaw OFF — IMU owns heading):
#   /wheel/odom → x, y, vx
#   /imu        → yaw, vyaw
# =============================================================================

ekf_filter_node:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    publish_tf: true
    publish_acceleration: false

    # -------------------------------------------------------------------------
    # ODOM0: encoders — x, y, vx (vy OFF, yaw OFF)
    # -------------------------------------------------------------------------
    odom0: /wheel/odom
    odom0_queue_size: 20
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    #                x     y     z
    #                roll  pitch yaw
    #                vx    vy    vz
    #                vroll vpitch vyaw
    #                ax    ay    az
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]

    # -------------------------------------------------------------------------
    # IMU0: yaw, vyaw only (ax/ay OFF)
    # -------------------------------------------------------------------------
    imu0: /imu
    imu0_queue_size: 50
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    initial_estimate_covariance:
