control_server:
  ros__parameters:

    titan:
      enabled: true
      sensors: ["titan0", "titan1"]  # titan1: OMS rotate m_2, lift m_1, home lim m_0
      titan0:
        can_id: 42
        motor_freq: 15600
        encoder_rate_hz: 20
        motor_update_rate_hz: 50
        limit_switches: false
        enable_freshness: true
        m_0:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_1:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: false
          invert_rpm: false
        m_2:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_3:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: false
          invert_rpm: false
      titan1:
        can_id: 43
        motor_freq: 15600
        # OMS on titan1: m_2 rotate, m_1 lift, m_3 Cypher linear encoder.
        # m_0 limit_rev = rotation home; m_0 limit_fwd = linear home.
        encoder_rate_hz: 10
        motor_update_rate_hz: 20
        limit_switches: true
        enable_freshness: true
        m_0:  # limit_rev=rotation home, limit_fwd=linear home
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_1:  # OMS belt lift — limit_fwd=up (home), limit_rev=down (floor)
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_2:  # OMS rotation
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: true
          invert_rpm: false
        m_3:  # Cypher Max linear encoder (quadrature)
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false

    imu:
      enabled: true
      name: "imu"
      topic: "imu"
      frame_id: "imu_link"

    encoder:
      enabled: false
      sensors: ["external_encoder"]
      external_encoder:
        port_a: 0
        port_b: 1
        topic: "external_encoder"

    duty_cycle:
      enabled: false
      sensors: ["absolute_encoder"]
      absolute_encoder:
        port: 12
        topic: "duty_cycle_encoder"

    servo:
      enabled: false
      sensors: ["linear_servo", "vertical_servo", "rotation_servo", "gripper_servo"]
      linear_servo:       # pin 12, continuous speed −100…100
        port: 12
        type: "continuous"
      vertical_servo:     # pin 13, standard degrees −150…150
        port: 13
        type: "standard"
      rotation_servo:     # pin 14, standard degrees −150…150
        port: 14
        type: "standard"
      gripper_servo:      # pin 15, standard degrees −150…150
        port: 15
        type: "standard"

    # Left/right US for walls/open; front obstacle from front lidar (Sharp disabled).
    ultrasonic:
      enabled: false
      # Lower rate + stagger: both sensors were pinging together → left heard right (fake 1–2 m)
      publish_rate_hz: 10.0
      stagger_ms: 50
      sensors: ["ultrasonic_left", "ultrasonic_right"]
      ultrasonic_left:
        ping: 8
        echo: 9
        frame_id: "ultrasonic_left_link"
      ultrasonic_right:
        ping: 10
        echo: 11
        frame_id: "ultrasonic_right_link"

    sharp:
      enabled: false

    dio:
      enabled: false
      sensors: ["limit_switch"]
      limit_switch:
        pin: 16
        type: "input"

    cobra:
      enabled: false
      sensors: ["line_follower"]
      line_follower:
        vref: 5.0

    light_tower:
      enabled: false
      name: "light_tower"
      pin_continuous: 0
      pin_red: 1
      pin_green: 2
      pin_yellow: 3
      pin_buzzer: 4
      default_blink_hz: 1.0

    gamepad:
      enabled: false
      axis_linear_x: 1
      axis_linear_y: -1
      axis_angular_z: 2
      button_turbo: 5
      linear_scale: 0.4
      angular_scale: 0.4
      deadzone: 0.10
      turbo_multiplier: 2.0
      publish_rate: 50
      cmd_vel_topic: "cmd_vel"
