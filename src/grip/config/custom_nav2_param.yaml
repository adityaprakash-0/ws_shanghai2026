# skill23_custom_nav + skill23_amcl + skill23_rpp parameters (grip)
# Nav2-style: one section per node name
# robot box from URDF: 0.44 x 0.363 x 0.21 m

/**:
  ros__parameters:
    robot: "grip"
    map_frame: "map"
    base_frame: "base_footprint"
    scan_topic: "/scan"
    robot_length: 0.44
    robot_width: 0.363
    robot_height: 0.21
    http_port: 8082

amcl:
  ros__parameters:
    use_sim_time: false
    # Wait for cn_world_model /custom_nav/world/ready before activating
    wait_for_world_ready: true
    world_ready_topic: "/custom_nav/world/ready"
    # Seed at startup (override with dashboard /initialpose anytime)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    laser_model_type: likelihood_field
    scan_topic: scan
    map_topic: map
    max_beams: 45
    laser_max_range: 8.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    z_hit: 0.85
    z_rand: 0.15
    z_max: 0.03
    z_short: 0.02
    sigma_hit: 0.18
    lambda_short: 0.1
    update_min_d: 0.05
    update_min_a: 0.1
    transform_tolerance: 1.0
    do_beamskip: false
    beam_skip_distance: 0.4
    beam_skip_threshold: 0.35
    beam_skip_error_threshold: 0.95
    save_pose_rate: 0.5
    first_map_only: true

cn_world_model:
  ros__parameters:
    occupied_thresh: 50
    map_frame: "map"

cn_obstacle_detector:
  ros__parameters:
    local_grid_width: 3.0
    local_grid_height: 3.0
    local_grid_resolution: 0.03
    inflation_radius_m: 0.03
    base_frame: "base_footprint"


cn_collision_checker:
  ros__parameters:
    robot_width: 0.363
    robot_length: 0.44
    safety_margin_m: 0.06
    near_m: 0.20
    stop_m: 0.12
    clearance_probe_m: 0.80
    window_deg: 5.0
    ray_step_deg: 2.5
    block_frames: 1
    clear_frames: 2

cn_recovery:
  ros__parameters:
    min_backup_m: 0.05
    max_backup_m: 0.20
    backup_rear_margin_m: 0.03
    backup_linear_vel: -0.10
    backup_timeout_sec: 5.0
    open_m: 0.20
    open_side_m: 0.12
    spin_angular_vel: 0.30
    spin_timeout_sec: 8.0
    recovery_wait_sec: 1.0
    max_recovery_attempts: 5
    # Deadlock guards: level-triggered start (not edge), FAIL re-arms after the
    # front has been clear, and "still blocked" must persist before spending an
    # attempt. See recovery_manager_node.py for the full rationale.
    block_trigger_sec: 0.5
    fail_reset_clear_sec: 3.0
    still_blocked_confirm_sec: 0.4

# Round every bend the controller would otherwise stop and re-align for, while
# staying inside max_dev_m of the planner route and keeping clearance_keep of
# the wall clearance the planner had.
cn_path_smoother:
  ros__parameters:
    path_style: "smoothed"
    min_turn_rad: 0.12
    fillet_radius_m: 0.18
    sample_step_m: 0.04
    min_clearance_m: 0.18
    max_offset_m: 0.0
    simplify_dev_m: 0.03
    max_dev_m: 0.10
    clearance_keep: 0.85
    clearance_ceiling_m: 0.30
    # 80 sweeps at 0.40 measured 16 deg worst heading step (was ~100 deg raw)
    # while staying 0.089 m from the planner route. Higher counts press against
    # max_dev_m and start folding new kinks along the corridor edge.
    relax_iterations: 80
    relax_weight: 0.40
    relax_turn_ref_rad: 0.10

cn_planner:
  ros__parameters:
    occupied_thresh: 50
    wall_cost_weight: 12.0
    dynamic_cost_weight: 5.0
    min_clearance_m: 0.18
    # Snap path onto local max-EDT (corridor center). Converted to cells
    # from the live map resolution (e.g. 0.10 m → 2 cells at 5 cm).
    ridge_snap_radius_m: 0.10
    # Turns only: go ahead past tip, then turn.
    corner_clearance_m: 0.30
    plan_sleep_sec: 0.5
    map_frame: "map"

# cn_controller — closed-loop AMCL path executor (not RPP).
# On grip: linear_vel / angular_vel are Titan DUTY (−1…1).
cn_controller:
  ros__parameters:
    linear_vel: 0.30
    angular_vel: 0.30
    fine_angular_vel: 0.16
    min_angular_vel: 0.16
    # Steering while driving needs far less than an in-place turn, so small
    # heading errors get a small correction instead of a full-size one.
    min_steer_vel: 0.09
    # Final yaw endgame: slow below yaw_slow_err so one /amcl_pose period
    # cannot rotate past final_yaw_tol (must stay under cn_goal_checker's tol).
    yaw_slow_err: 0.35
    yaw_slow_vel: 0.10
    final_yaw_tol: 0.05
    yaw_pulse_off_ticks: 1
    lookahead_dist: 0.10
    heading_align_threshold: 0.25
    # Must stay wider than the turn completed in one /amcl_pose period,
    # otherwise the align state can never see itself arrive and hunts.
    heading_aligned_threshold: 0.15
    heading_deadband: 0.04
    control_rate_hz: 20.0
    angular_sign: 1.0
    # AMCL publishes /amcl_pose ~scan rate (≈10 Hz with *_lidar_nav.yaml).
    # 0.5s was too tight when Orbbec USB init steals CPU/bus bandwidth.
    pose_timeout_sec: 1.2
    pose_warn_interval_sec: 2.0
    nearest_search_window: 12
    nearest_reseed_dist: 0.40
    pose_jump_dist: 0.30

# Goal XY/yaw completion lives here only (controller listens to /custom_nav/goal_status).
cn_goal_checker:
  ros__parameters:
    xy_goal_tolerance: 0.12
    # Tight enough that GOAL_REACHED means the robot is actually facing the
    # waypoint yaw; the relaxed value only applies after the settle timeout.
    yaw_goal_tolerance: 0.08
    yaw_relaxed_tolerance: 0.20
    yaw_settle_timeout_sec: 8.0
