control_server:
  ros__parameters:

    # -------------------------------------------------------------------------
    # Titan — CAN bus motor controller (up to 4 motors per unit)
    # -------------------------------------------------------------------------
    titan:
      enabled: true
      sensors: ["titan0"]
      titan0:
        can_id: 42
        motor_freq: 15600
        encoder_rate_hz: 20
        motor_update_rate_hz: 50
        limit_switches: false
        enable_freshness: false
        m_0:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_1:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: true
          invert_encoder: true
          invert_rpm: false
        m_2:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: false
          invert_rpm: false
        m_3:
          encoder_mode: "quadrature"
          dist_per_tick: 1.0
          invert_motor: false
          invert_encoder: false
          invert_rpm: false

    # -------------------------------------------------------------------------
    # IMU — onboard 9-axis IMU
    # -------------------------------------------------------------------------
    imu:
      enabled: true
      name: "imu"
      topic: "imu"
      frame_id: "imu_link"

    # -------------------------------------------------------------------------
    # Encoder — quadrature encoder via two digital input channels
    # -------------------------------------------------------------------------
    encoder:
      enabled: false
      sensors: ["external_encoder"]
      external_encoder:
        port_a: 0
        port_b: 1
        topic: "external_encoder"

    # -------------------------------------------------------------------------
    # Duty Cycle Encoder — absolute encoder via PWM duty cycle
    # -------------------------------------------------------------------------
    duty_cycle:
      enabled: false
      sensors: ["absolute_encoder"]
      absolute_encoder:
        port: 8
        topic: "duty_cycle_encoder"

    # -------------------------------------------------------------------------
    # Servo — standard, continuous, or linear servo
    # -------------------------------------------------------------------------
    servo:
      enabled: false
      sensors: ["arm_servo"]
      arm_servo:
        port: 14
        type: "standard" # "standard", "continuous", or "linear"

    # -------------------------------------------------------------------------
    # Ultrasonic — HC-SR04-style sonar range sensor
    # -------------------------------------------------------------------------
    ultrasonic:
      enabled: false
      sensors: ["front_sonar"]
      front_sonar:
        ping: 8
        echo: 9
        frame_id: "front_sonar_link"

    # -------------------------------------------------------------------------
    # Sharp — GP2Y-series infrared range sensor
    # -------------------------------------------------------------------------
    sharp:
      enabled: false
      sensors: ["wall_sensor"]
      wall_sensor:
        port: 22
        frame_id: "sharp_link"

    # -------------------------------------------------------------------------
    # DIO — digital input or output pin
    # -------------------------------------------------------------------------
    dio:
      enabled: false
      sensors: ["limit_switch"]
      limit_switch:
        pin: 15
        type: "input" # "input" or "output"

    # -------------------------------------------------------------------------
    # Cobra — 4-channel reflectance sensor array (I2C)
    # -------------------------------------------------------------------------
    cobra:
      enabled: false
      sensors: ["line_follower"]
      line_follower:
        vref: 5.0

    # -------------------------------------------------------------------------
    # Light Tower — 5-output indicator LED tower
    # -------------------------------------------------------------------------
    light_tower:
      enabled: false
      sensors: ["status_tower"]
      status_tower:
        red_pin: 2
        green_pin: 3
        yellow_pin: 4
        buzzer_pin: 5
        enable_pin: 6

    # -------------------------------------------------------------------------
    # Gamepad — disabled during autonomous Nav2 (fights /cmd_vel with Nav2)
    gamepad:
      enabled: true
      axis_linear_x: 1
      axis_linear_y: 0
      axis_angular_z: 2
      button_turbo: 5
      linear_scale: 0.3
      angular_scale: 0.3
      deadzone: 0.05
      turbo_multiplier: 2.0
      publish_rate: 50
      cmd_vel_topic: "cmd_vel"