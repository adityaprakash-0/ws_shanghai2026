# OMS — all mechanisms. Boot homing via oms_home (sequence below).
# Teleop reference: mypackage oms_node (Q/E R/F T/G Y/H U/J I/K).
# IMPORTANT: all numeric ros__parameters that nodes declare as float MUST use
# a decimal (e.g. -90.0 not -90) or rclpy raises InvalidParameterTypeException.

oms_home:
  ros__parameters:
    # false = idle at launch; home only when Studio Home is pressed.
    auto_home: false
    startup_delay_sec: 2.0
    step_timeout_sec: 60.0
    inter_step_sec: 0.5
    # Home pose: lift up → linear rear → vertical down → gripper close → rotation servo in.
  #  sequence: [rotation,lift, linear, vertical, gripper, rotation_servo]
    sequence: [gripper, lift, linear, vertical, rotation_servo, rotation]


oms_rotation:
  ros__parameters:
    titan_service: /titan1/titan_cmd
    rotate_motor: 2
    encoder_topic: /titan1/m_2/encoder
    cmd_topic: /titan1/m_2/cmd
    home_limit_topic: /titan1/m_0/limit_rev
    duty: 0.12
    duty_min: 0.07
    home_duty: 0.20
    duty_sign: -1.0
    ticks_sign: 1.0
    min_deg: -90.0
    max_deg: 90.0
    angle_tol_deg: 1.0
    settle_sec: 0.25
    goto_timeout_sec: 20.0
    home_timeout_sec: 25.0
    stall_sec: 1.0
    stall_ticks: 6.0
    stall_travel_deg: 25.0
    motion_log: /home/vmx/skill23_ws/studio_maps/_logs/oms_motion.csv
    motion_log_hz: 5.0
    control_hz: 20.0
    status_hz_active: 10.0
    status_hz_idle: 2.5
    duty_step: 0.01
    auto_home: false
    home_search_sign: 1.0
    kp: 0.12
    ki: 0.0
    kd: 0.0
    i_limit: 0.2
    encoder_cpr: 6.0
    quadrature: 4.0
    gearbox_ratio: 71.2
    sun_teeth: 120.0
    pinion_teeth: 32.0
    ticks_per_deg: 0.0

oms_lift:
  ros__parameters:
    titan_service: /titan1/titan_cmd
    lift_motor: 1
    encoder_topic: /titan1/m_1/encoder
    cmd_topic: /titan1/m_1/cmd
    up_limit_topic: /titan1/m_1/limit_fwd
    down_limit_topic: /titan1/m_1/limit_rev
    duty: 0.5
    duty_down: 0.3
    home_duty: 0.5
    # +1: positive PID error (need to go down) → +duty = teleop F.
    # −1 was wrong and drove UP on every down command.
    duty_sign: 1.0
    ticks_sign: 1.0
    # Lift odometry frame (chain travel, NOT ground height directly):
    #   0 mm = UP limit (upper plate on switch) — reference ~390 mm above ground.
    #   +mm = downward chain travel.  lift 100 → 100 mm down from home (~290 mm ground).
    #   max = DOWN limit (lower plate on switch) — 250 mm travel (390−140 cm).
    # Calibrate ticks_per_mm on bench (see comment at sprocket_teeth); 0 = use formula.
    min_mm: 0.0
    max_mm: 500.0
    pos_tol_mm: 2.0
    settle_sec: 0.25
    goto_timeout_sec: 30.0
    home_timeout_sec: 35.0
    stall_sec: 0.70
    stall_ticks: 6.0
    motion_log: /home/vmx/skill23_ws/studio_maps/_logs/oms_lift_motion.csv
    motion_log_hz: 5.0
    control_hz: 20.0
    status_hz_active: 10.0
    status_hz_idle: 2.5
    duty_step: 0.01
    auto_home: false
    home_search_sign: -1.0
    kp: 0.04
    ki: 0.0
    kd: 0.0
    i_limit: 0.3
    encoder_cpr: 6.0
    quadrature: 4.0
    gearbox_ratio: 99.5
    bevel_pinion_teeth: 13.0
    bevel_gear_teeth: 26.0
    spur_pinion_teeth: 32.0
    spur_gear_teeth: 64.0
    # OMS Lift Odometry: height = ticks×(p×N×k)/T_rev,  T_rev=9552,  p×N×k=152.4 (24T)
    #   100 mm → 6268 ticks   250 mm → 15669 ticks   TICKS_PER_MM ≈ 62.677
    # chain_stages: 1 = direct clamp, 2 = cascading (doubles travel per tick).
    sprocket_teeth: 24.0
    chain_pitch_mm: 6.35
    chain_stages: 1.0
    # 0 = use formula above; set after bench calibration if needed.
    ticks_per_mm: 0.0

# Linear — Cypher Max on M3, Smart Servo 200 on /linear_servo/cmd.
# Home = M0 limit_fwd (rear). 0 mm = home. +mm = forward (teleop T).
oms_linear:
  ros__parameters:
    titan_service: /titan1/titan_cmd
    encoder_motor: 3
    encoder_topic: /titan1/m_3/encoder
    linear_cmd_topic: /linear_servo/cmd
    home_limit_topic: /titan1/m_0/limit_fwd
    speed: 16.0
    speed_min: 11.0
    home_speed: 12.0
    # Creep under this encoder distance while homing (before switch).
    # Must stay ≥ ~10 — continuous servo won't move at 3–5.
    home_approach_mm: 28.0
    approach_mm: 12.0
    # Command polarity on /linear_servo/cmd (Studica continuous):
    # With speed_sign=+1: +cmd = forward (+mm), −cmd = rear home.
    # Leave-home / home / PID all use this sign (no hardcoded ±speed).
    # NOTE: while home_sw pressed, only rearward cmds are blocked — forward must pass.
    # Limit press → stop + software zero only (NO Cypher reset_encoder).
    speed_sign: 1.0
    # Forward leave-home decreases Cypher ticks (03:01:43: 305 → −927 at cmd=+).
    # ticks_sign=-1 so pos_mm increases when leaving home.
    ticks_sign: -1.0
    min_mm: 0.0
    max_mm: 150.0
    pos_tol_mm: 3.0
    settle_sec: 0.40
    goto_timeout_sec: 40.0
    home_timeout_sec: 40.0
    stall_sec: 0.80
    stall_ticks: 6.0
    motion_log: /home/vmx/skill23_ws/studio_maps/_logs/oms_linear_motion.csv
    motion_log_hz: 5.0
    control_hz: 20.0
    status_hz_active: 10.0
    status_hz_idle: 2.5
    duty_step: 0.01
    auto_home: false
    kp: 0.10
    ki: 0.0
    kd: 0.0
    i_limit: 0.4
    # Cypher M3 glitch filter + goto coast (software home_ticks is authoritative).
    enc_max_jump_ticks: 80.0
    pos_filter_alpha: 0.35
    approach_mm: 8.0
    # Continuous servo precision: speed 11 spins but cannot reliably move the
    # loaded rack. Use a short speed-16 pulse, then measure after coast.
    precision_zone_mm: 30.0
    precision_speed: 16.0
    # Full 0.20 s pulse at >=18 mm error; scales down to 0.10 s near target.
    precision_pulse_sec: 0.20
    precision_pulse_min_sec: 0.10
    precision_full_pulse_error_mm: 18.0
    precision_coast_sec: 0.35
    # Cypher Max on pinion shaft: 512×4 = 2048 ticks/rev (Studica docs — OK).
    # Rack & pinion: mm_per_rev = π × pitch_dia (NOT the old 50 mm assumption).
    # Calibrated from goto 70 → ~120 mm physical, Δticks=2936 → 83.7 mm/rev.
    encoder_cpr: 512.0
    quadrature: 4.0
    mm_per_rev: 83.7
    ticks_per_mm: 0.0

oms_vertical:
  ros__parameters:
    service: /vertical_servo/set_servo
    up_deg: 100.0
    down_deg: -90.0
    settle_sec: 0.8
    auto_home: false

oms_rotation_servo:
  ros__parameters:
    service: /rotation_servo/set_servo
    hw_cmd_topic: /rotation_servo/cmd   # Float64 degrees → PWM duty
    # Home = in (−30°). Alt = out.
    home_deg: -100.0
    alt_deg: 75.0
    alt_mode: out
    settle_sec: 0.35
    # Standard servo: no HW velocity. Slow motion = stepped PWM angles on hw_cmd.
    # 0 = jump straight to target angle.
    slew_deg_per_sec: 40.0
    slew_hz: 25.0
    auto_home: false

oms_gripper:
  ros__parameters:
    service: /gripper_servo/set_servo
    home_deg: -50.0      # close
    alt_deg: -150.0       # open
    alt_mode: open
    settle_sec: 0.8
    auto_home: false

# Visual / analysis frame used by OMS Software (not a ROS node).
# Ground-measured heights (same reference point on the moving stack every time):
#   UP limit (lift_mm=0):   390 mm above ground (upper plate on switch).
#   DOWN limit (lift_mm=250): 140 mm above ground (lower plate on switch).
#   3 cm gap between upper/lower plates — limits sit on different plates; encoder
#   tracks total chain travel (250 mm), not plate gap.
# lift_mm = down from upper home.  ground_height = lift_upper_z_mm − lift_mm.
oms_viz:
  ros__parameters:
    lift_upper_z_mm: 390.0
    lift_lower_z_mm: 140.0
    lift_travel_mm: 250.0
    z_top_mm: 390.0
    z_floor_mm: 140.0
    linear_travel_mm: 110.0
    linear_home_x_mm: 220.0
    linear_max_extension_mm: 110.0
    linear_max_reach_mm: 330.0
    linear_ref_z_lower_lift_mm: 110.0
    linear_ref_z_upper_lift_mm: 375.0
    total_oms_height_mm: 575.0
    rail_height_mm: 575.0
    turntable_diameter_mm: 180.0
    camera_tilt_deg: 35.0
    camera_tz_mm: 435.0
    gripper_servo_mm: 110.0
    gripper_length_mm: 200.0
