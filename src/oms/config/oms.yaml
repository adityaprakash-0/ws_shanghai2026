# OMS rotation — same mechanism on every robot.
#
# Titan1 M2 = rotation (Studica Maverick 71.2:1 + encoder).
# 32T pinion walks around a stationary 120T gear (Ø 122 mm).
# Home switch: Titan1 M0 lim_rev = 0° (front).
# Range: +90° ACW / −90° CW (ROS). Mechanical stops at ±90°.
# duty_sign -1: negative duty = ACW = +deg (same as mypackage oms_node Q).

oms_rotation:
  ros__parameters:
    titan_service: /titan1/titan_cmd
    rotate_motor: 2
    encoder_topic: /titan1/m_2/encoder
    cmd_topic: /titan1/m_2/cmd
    home_limit_topic: /titan1/m_0/limit_rev
    duty: 0.10
    duty_min: 0.06
    home_duty: 0.20
    duty_sign: -1.0
    ticks_sign: 1.0
    min_deg: -90.0
    max_deg: 90.0
    angle_tol_deg: 1.5
    settle_sec: 0.25
    goto_timeout_sec: 20.0
    home_timeout_sec: 25.0
    stall_sec: 0.70
    stall_ticks: 6.0
    stall_travel_deg: 25.0
    motion_log: /home/vmx/skill23_ws/studio_maps/_logs/oms_motion.csv
    motion_log_hz: 10.0
    control_hz: 20.0
    auto_home: true
    home_search_sign: 1.0
    kp: 0.08
    ki: 0.0
    kd: 0.0
    i_limit: 0.2
    encoder_cpr: 6.0
    quadrature: 4.0
    gearbox_ratio: 71.2
    sun_teeth: 120.0
    pinion_teeth: 32.0
    # 0 = use formula (6408 ticks/rev → 17.80 ticks/deg). Set >0 only after
    # Section 6 calibration if bench differs from 6408 counts per 360°.
    ticks_per_deg: 0.0

# Vertical servo — same as mypackage oms_node Y/H.
# Home is always down. Node forces down on start.
oms_vertical:
  ros__parameters:
    service: /vertical_servo/set_servo
    up_deg: 50.0
    down_deg: -40.0
    settle_sec: 0.8
    auto_home: true

