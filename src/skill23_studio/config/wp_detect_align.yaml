# Detect+Align — one YAML for every robot (OMS is the same mechanism).
#
# After Nav2 reaches the waypoint: enable color, drop the first skip_frames,
# run YOLO on the next snapshot, command OMS rotation (absolute deg from
# home / limit switch), snapshot-verify, then one-shot depth at camera_tilt_deg.
# The base does not yaw. Titan /cmd_vel is unused here.
#
# Bench: ros2 launch skill23_studio test_detect_align.launch.py robot:=allterrain
#        then: ros2 run skill23_studio studio_detect_align_test

detect_align:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    cmd_topic: /studio/detect_align/cmd
    result_topic: /studio/detect_align/result
    cancel_topic: /studio/detect_align/cancel
    status_topic: /studio/detect_align/status
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    model_dir: ''
    input_size: 320
    conf_threshold: 0.35
    nms_iou: 0.45
    num_threads: 1
    target_class: -1
    target_name: 'Cylinder'
    gripper_name: ''
    gripper_u_norm: 0.0
    min_box_area_frac: 0.002
    control_rate_hz: 8.0
    center_tol_norm: 0.05
    center_u_offset: 0.0
    confirm_frames: 2
    detect_wait_sec: 8.0
    align_timeout_sec: 25.0
    depth_after_align_sec: 1.0
    depth_samples: 5
    depth_sample_timeout_sec: 4.0
    depth_roi_frac: 0.08
    camera_tilt_deg: 35.0
    hfov_deg: 69.0
    skip_frames: 4
    verify_skip_frames: 2
    hold_after_done_sec: 1.0
    retries: 2
    retry_pause_sec: 0.4
    angular_sign: 1.0
    oms_cmd_topic: /oms/rotation/cmd
    oms_result_topic: /oms/rotation/result
    oms_status_topic: /oms/rotation/status
    oms_timeout_sec: 25.0
    max_oms_moves: 5
    oms_vertical_cmd_topic: /oms/vertical/cmd
    oms_vertical_result_topic: /oms/vertical/result
    oms_vertical_timeout_sec: 8.0
    log_hz: 2.0
