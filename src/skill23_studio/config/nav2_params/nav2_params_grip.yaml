
amcl:
  ros__parameters:
    use_sim_time: false
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    laser_model_type: likelihood_field
    scan_topic: /scan
    max_beams: 45
    laser_max_range: 8.0
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    z_hit: 0.85
    z_rand: 0.15
    z_max: 0.03
    z_short: 0.02
    sigma_hit: 0.18
    lambda_short: 0.1
    update_min_d: 0.0
    update_min_a: 0.0
    transform_tolerance: 1.0
    do_beamskip: false
    beam_skip_distance: 0.4
    beam_skip_threshold: 0.35
    beam_skip_error_threshold: 0.95
    save_pose_rate: 0.5

