bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.02
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: True
    FollowPath:
      plugin: skill23_path_collision/PathAheadCollisionController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      path_collision_enabled: true
      path_collision_mode: path_ahead
      path_collision_cost_threshold: 254.0
      path_collision_lookahead_time: 1.0
      path_collision_min_lookahead_dist: 0.15
      path_collision_min_check_speed: 0.05
      path_collision_sample_step: 0.05
      # Near goal XY: pause ONLY wrapper path-ahead (RPP CD already off → no pause_rpp_cd).
      path_collision_disable_at_goal_yaw: true
      path_collision_goal_xy_dist: 0.18
      path_collision_debug: true
      path_collision_use_travel_yaw: true
      desired_linear_vel: 0.20
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.40
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.0
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.30
      cost_scaling_gain: 2.0
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.30
      rotate_to_heading_min_angle: 0.40
      allow_reversing: false

    # --- Alternate: RPP CD ON while driving; muted only at goal yaw-align ---
    # Stock RPP alone cannot mute CD during goal rotate. Keep this wrapper with
    # path_collision_enabled:false (no path-ahead) + pause_rpp_cd_at_goal_yaw:true
    # (near goal XY wrapper rotates in place instead of calling RPP).
    # FollowPath:
    #   plugin: skill23_path_collision/PathAheadCollisionController
    #   primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
    #   path_collision_enabled: false
    #   path_collision_disable_at_goal_yaw: true
    #   path_collision_pause_rpp_cd_at_goal_yaw: true
    #   path_collision_goal_xy_dist: 0.18
    #   desired_linear_vel: 0.20
    #   lookahead_dist: 0.20
    #   min_lookahead_dist: 0.15
    #   max_lookahead_dist: 0.40
    #   lookahead_time: 0.8
    #   use_velocity_scaled_lookahead_dist: false
    #   transform_tolerance: 0.5
    #   min_approach_linear_velocity: 0.1
    #   approach_velocity_scaling_dist: 0.40
    #   use_collision_detection: true
    #   max_allowed_time_to_collision_up_to_carrot: 0.6
    #   use_regulated_linear_velocity_scaling: true
    #   regulated_linear_scaling_min_radius: 1.0
    #   regulated_linear_scaling_min_speed: 0.0
    #   use_cost_regulated_linear_velocity_scaling: false
    #   cost_scaling_dist: 0.30
    #   cost_scaling_gain: 2.0
    #   use_rotate_to_heading: true
    #   rotate_to_heading_angular_vel: 0.30
    #   rotate_to_heading_min_angle: 0.40
    #   allow_reversing: false


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.03
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 1.0
      footprint: "[[0.22, 0.18], [0.22, -0.18], [-0.22, -0.18], [-0.22, 0.18]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15
          raytrace_max_range: 3.0
          raytrace_min_range: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.02
        cost_scaling_factor: 4.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 4.0
      publish_frequency: 2.0
      transform_tolerance: 1.0
      always_send_full_costmap: false
     # footprint: "[[0.22, 0.18], [0.22, -0.18], [-0.22, -0.18], [-0.22, 0.18]]"
      robot_radius: 0.20
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.28
        cost_scaling_factor: 6.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    # GridBased: free cells + 253 only if corridor gap ≥ robot_width + margin
    planner_plugins: [GridBased]
    GridBased:
      plugin: skill23_clearance_planner/ClearancePlanner
      use_final_approach_orientation: true
      allow_unknown: false
      allow_narrow: false
      use_inscribed_width_gate: true
      robot_width: 0.38
      inscribed_width_margin: 0.02
      shift_goal_off_inscribed: true
      straight_line_only: false
      smooth_path: true
      smooth_iterations: 10
      max_deviation: 0.05
      w_distance: 0.5
      w_cell_cost: 20.0
      w_inflation: 1.0
      turn_penalty: 16.0
      narrow_wall_penalty: 50.0
      edt_narrow_weight: 40.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      max_its: 0
      w_smooth: 0.0
      w_data: 1.0
      tolerance: 1.0e-10
      do_refinement: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 0.5
    # Spin recovery uses these (45° escape); keep ≈0.13 rad/s as requested
    max_rotational_vel: 0.40
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
