# Minimal Nav2 params: map_server + global_costmap (static + inflation) + planner_server.
# No obstacle layer, no local costmap, no controller / BT / AMCL.
# Used by studio_gc_planner.launch.py for dashboard path preview + RViz global costmap.
# Both planners are loaded; Studio Simulate picks one via planner_id.

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 2.0
      always_send_full_costmap: true
      robot_radius: 0.20
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.28
        cost_scaling_factor: 6.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    # GridBased: free cells only (0–252); diagonal A* + stay-on-path smooth when straight_line_only=false
    planner_plugins: [GridBased]
    GridBased:
      plugin: skill23_clearance_planner/ClearancePlanner
      use_final_approach_orientation: true
      allow_unknown: false
      allow_narrow: false
      shift_goal_off_inscribed: true
      straight_line_only: false
      smooth_path: true
      smooth_iterations: 10
      max_deviation: 0.05
      w_distance: 0.5
      w_cell_cost: 20.0
      w_inflation: 1.0
      turn_penalty: 16.0
      narrow_wall_penalty: 50.0
      edt_narrow_weight: 40.0
