# Case-nav software params — allterrain (differential drive)
# Sensors: front+back lidar + left/right ultrasonics (no IR)
/**:
  ros__parameters:
    robot: "allterrain"
    map_frame: "map"
    base_frame: "base_footprint"
    odom_topic: "/odometry/filtered"
    wheel_odom_topic: "/wheel/odom"
    imu_topic: "/imu"
    scan_topic: "/scan"
    front_scan_topic: "/scan/front"
    us_left_topic: "/ultrasonic_left/range"
    us_right_topic: "/ultrasonic_right/range"
    front_block_m: 0.25
    wall_detect_m: 0.45
    open_thresh_m: 0.55
    debounce_count: 3
    open_debounce_count: 2
    enable_wall_centering: false
    center_kp: 1.2
    heading_kp: 0.8
    heading_max_corr: 0.15
    forward_speed: 0.12
    turn_speed: 0.25
    spin_speed: 0.12
    yaw_tol_deg: 4.0
    goal_xy_tol: 0.15
    lidar_fov_deg: 90.0
    drive_block_margin_m: 0.05
    lidar_idle_wait_sec: 3.0
    grid_cell_m: 0.06
    occupied_thresh: 50
    turn_penalty: 80.0
    clearance_weight: 60.0
    inflate_margin_m: 0.04
    lidar_wake_sec: 2.0
    lidar_stamp_max_range: 2.0
    lidar_idle_sleep_sec: 3.0
    max_recovery_attempts: 5
    slip_wheel_vx_min: 0.08
    slip_accel_max: 0.25
    slip_hold_count: 5
    http_port: 8082
    robot_length: 0.43
    robot_width: 0.4
