# Wheel safety guard — mecanum (holonomic lateral push)
wheel_safety_guard:
  ros__parameters:
    input_topic: /cmd_vel_nav_smoothed
    output_topic: /cmd_vel
    ultrasonic_fl_topic: /ultrasonic_fl/range
    ultrasonic_rl_topic: /ultrasonic_rl/range
    ir_fr_topic: /ir_fr/range
    ir_rr_topic: /ir_rr/range
    danger_distance_m: 0.08
    safe_distance_m: 0.10
    push_linear_y: 0.10
    pulse_duration_s: 0.12
    cooldown_s: 0.40
    control_rate_hz: 10.0
