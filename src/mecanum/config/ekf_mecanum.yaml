ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true 

    # ----------------------------------------------------
    # ODOM0: Wheel Encoders
    # ----------------------------------------------------
    odom0: /wheel/odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,  
                   false, false, false,
                   false, false, false]

    # ----------------------------------------------------
    # IMU0: VMX-Pi IMU
    # ----------------------------------------------------
