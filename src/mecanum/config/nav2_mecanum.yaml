amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2  
    alpha4: 0.2
    alpha5: 0.2  
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::OmniMotionModel"
    update_min_a: 0.05   # <--- Update AMCL on tiny rotations
    update_min_d: 0.02   # <--- Update AMCL on tiny movements
    
    max_beams: 60
    max_particles: 4000
    min_particles: 200
    
    # FIX 4: AMCL LASER TRUST
    # z_hit = Trust the laser. z_rand = Assume it's random noise.
    # You had them both at 0.5. AMCL thought half your laser data was fake!
    z_hit: 0.8    # <--- Trust the laser 90%
    z_max: 0.05
    z_rand: 0.2   # <--- Only 10% is noise
    z_short: 0.05
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    pf_err: 0.05
    pf_z: 0.99
    tf_broadcast: true
    transform_tolerance: 0.7
    scan_topic: scan


