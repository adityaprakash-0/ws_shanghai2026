bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True



controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
      
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      max_angular_vel: 0.22
      
      lookahead_dist: 0.28 
      min_lookahead_dist: 0.20 
      max_lookahead_dist: 0.35 
      lookahead_time: 1.0 
      transform_tolerance: 1.0    
      use_velocity_scaled_lookahead_dist: true 
      
      min_approach_linear_velocity: 0.10 
      approach_velocity_scaling_dist: 0.20 
      
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true 
      regulated_linear_scaling_min_radius: 0.50 
      regulated_linear_scaling_min_speed: 0.08 
      use_cost_regulated_linear_velocity_scaling: true 
      cost_scaling_dist: 0.20                            
      cost_scaling_gain: 1.5                            
      
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.20 
      rotate_to_heading_min_angle: 0.10 #0.05(2deg) #0.20 
      allow_reversing: false

    
    # FollowPath:
    #   plugin: "nav2_mecanum_grid_controller::MecanumGridController"
    #   kp_x: 2.0
    #   kp_y: 2.5
    #   kp_theta: 2.0
    #   # Hardware Limits
    #   max_vel_x: 0.40
    #   max_vel_y: 0.30
    #   max_vel_theta: 0.25
    #   lookahead_dist: 0.25  # Keep this small to perfectly track sharp grid corners
    #   sim_time: 0.3         # Looks 1.0s ahead for obstacle collision
    #   # These should match your Goal Checker tolerances
    #   xy_tolerance: 0.05
    #   yaw_tolerance: 0.10



local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 1.0
      # Do this for BOTH local_costmap and global_costmap
      #robot_radius: 0.15 
      #top-left, top-right, rear right, rear left
      footprint: '[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]'
      plugins: ["obstacle_layer", "inflation_layer"] 
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0 
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0 #3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 #2.5
          obstacle_min_range: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      resolution: 0.05
      transform_tolerance: 1.0
      robot_radius: 0.25 
     # footprint: '[ [0.215, 0.20], [0.215, -0.20], [-0.215, -0.20], [-0.215, 0.20] ]'
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True


planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smart_center_planner::SmartCenterPlanner"
      # --- Smart Center Planner Parameters ---
      center_weight: 8.0
      smooth_iterations: 3   # <--- Change this to control smoother strength!
      turn_penalty: 0.1


# planner_server:
