#       # --- Smart Center Planner Parameters ---
#       center_weight: 4.0
#       smooth_iterations: 0   # <--- Change this to control smoother strength!
#       turn_penalty: 60.0


smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      max_its: 0 
      w_smooth: 0.0 
      w_data: 1.0
      tolerance: 1.0e-10
      do_refinement: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 7.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: true
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.20
    min_rotational_vel: 0.13
    rotational_acc_lim: 0.75

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 7.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # FIX 8: MATCH DWB LIMITS
    # The smoother intercepts DWB's commands. It must be identical to DWB's max limits!
    max_velocity: [0.40, 0.0, 0.25]
    min_velocity: [-0.40, 0.0, -0.25]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0




